[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe-small-model-harness"
version = "0.1.0"
description = "A constrained, deterministic Frappe 16 application compiler and workflow harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
frappe-harness = "frappe_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
