name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pytest
      - run: python -m py_compile src/frappe_harness/*.py

  pi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
        working-directory: packages/frappe-harness-pi
      - run: npm run check
        working-directory: packages/frappe-harness-pi
      - run: npm run contract-smoke
        working-directory: packages/frappe-harness-pi
      - run: npm run headless-equivalence-smoke
        env:
          FRAPPE_HARNESS_BIN: frappe-harness
        working-directory: packages/frappe-harness-pi
      - run: npm run pi-lifecycle-smoke
        working-directory: packages/frappe-harness-pi
      - run: npm run host-smoke
        working-directory: packages/frappe-harness-pi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run verify
        working-directory: frontend
